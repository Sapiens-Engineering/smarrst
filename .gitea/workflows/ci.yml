name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: node-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: node-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all --all-targets -- -Dwarnings

  test:
    name: Test
    runs-on: node-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all

  audit:
    name: Security Audit
    runs-on: node-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit

  mirror-to-github:
    name: Mirror to GitHub
    needs: [fmt, clippy, test, audit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: node-latest
    steps:
      - name: Mirror - Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror - Push to GitHub
        env:
          GITHUB_PAT: ${{ secrets.MIRROR_GITHUB_PAT }}
        run: |
          git config --global user.email "mail@sapiens.engineering"
          git config --global user.name "Sapient Engineer"
          git remote add gh "https://x-access-token:$GITHUB_PAT@github.com/Sapiens-Engineering/smarrst.git"
          git fetch origin
          git push gh HEAD:master --tags --force
